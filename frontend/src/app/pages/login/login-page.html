<section class="card auth-card">
  <div class="tabs">
    <button type="button" [class.active]="mode() === 'login'" (click)="switchMode('login')">Вхід</button>
    <button type="button" [class.active]="mode() === 'register'" (click)="switchMode('register')">
      Реєстрація
    </button>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label>
      Email
      <input type="email" formControlName="email" autocomplete="email" />
    </label>
    @if (form.controls.email.touched && form.controls.email.invalid) {
      <p class="field-error">Введіть коректний email.</p>
    }

    <label>
      Пароль
      <input
        type="password"
        formControlName="password"
        [attr.autocomplete]="mode() === 'login' ? 'current-password' : 'new-password'"
      />
    </label>
    @if (form.controls.password.touched && form.controls.password.invalid) {
      <p class="field-error">Пароль має містити щонайменше 6 символів.</p>
    }

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <button type="submit" class="primary" [disabled]="submitting()">
      {{ mode() === 'login' ? 'Увійти' : 'Зареєструватися' }}
    </button>
  </form>
</section>
