<header class="topbar">
  <div class="topbar-inner">
    <div class="nav">
      <span class="brand">Numerical Lab</span>
      @if (auth.isAdmin()) {
        <a routerLink="/jobs" routerLinkActive="active">Задачі</a>
        <a routerLink="/admin" routerLinkActive="active">Адмін-панель</a>
      }
    </div>
    @if (auth.isLoggedIn()) {
      <div class="user">
        <span>{{ auth.email() }}</span>
        <button type="button" class="secondary" (click)="auth.logout()">Вийти</button>
      </div>
    }
  </div>
</header>

<main class="container">
  <router-outlet />
</main>
